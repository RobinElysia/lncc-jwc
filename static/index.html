<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="辽宁省交通高等专科学校教务处官方网站，提供人才培养、教学信息、考务信息、资料下载等教务服务，面向学生、教师与教学管理人员。">
  <title>辽宁省交通高等专科学校 教务处</title>
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <div id="top-bar" class="top-bar"></div>
  <header id="site-header" class="site-header"></header>
  <nav id="site-nav" class="site-nav" aria-label="主导航"></nav>

  <main class="page">
    <!-- 第一屏：教学信息 + 考务信息 -->
    <div class="grid-7-5">
      <section id="section-teaching" aria-label="教学信息"></section>
      <section id="section-exam" aria-label="考务信息"></section>
    </div>

    <div class="divider-row" aria-hidden="true"></div>

    <!-- 第二屏：人才培养 -->
    <section id="section-talent" aria-label="人才培养"></section>

    <div class="divider-row" aria-hidden="true"></div>

    <!-- 第三屏：资料下载 -->
    <section id="section-download" aria-label="资料下载"></section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
