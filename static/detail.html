<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="文章详情 - 辽宁省交通高等专科学校教务处">
  <title>文章详情 - 辽宁省交通高等专科学校 教务处</title>
  
  <!-- Fonts -->
  <link rel="preload" href="css/fonts.css" as="style">
  <link rel="stylesheet" href="css/fonts.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top Bar -->
  <div style="background-color: var(--secondary); padding: 0.75rem 1rem; font-size: 0.875rem; text-align: center; border-bottom: 1px solid var(--border);">
    欢迎访问教务处信息发布平台 | <a href="#" style="margin-left: 1rem;">联系我们</a>
  </div>

  <!-- Header -->
  <header>
    <div class="header-banner">
      <img src="images/banner.jpg" alt="校园主楼">
      <div class="header-overlay">
        <div class="header-content">
          <div class="header-logo">
            <img src="images/logo.jpg" alt="校徽">
          </div>
          <div class="header-text">
            <h1>辽宁省交通高等专科学校<span class="title-separator">教&nbsp;务&nbsp;处</span></h1>
            <p class="header-subtitle">ACADEMIC AFFAIRS OFFICE · LIAONING PROVINCIAL COLLEGE OF COMMUNICATIONS</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html">首页</a></li>
      <li><a href="articles.html">通知公告</a></li>
      <li><a href="https://jwxt.lncc.edu.cn" target="_blank">教务系统</a></li>
      <li><a href="#" onclick="alert('资料下载功能建设中'); return false;">资料下载</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main id="article-container">
    <div id="loading" style="text-align: center; padding: 2rem; color: var(--muted-foreground);">
      加载中...
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 辽宁省交通高等专科学校 教务处</p>
    <p>地址：辽宁省沈阳市浑南新区浑河中路 | 电话：024-62280000</p>
    <p style="font-size: 0.75rem; margin-top: 1rem;">本站仅供学术交流使用，严禁用于任何商业目的</p>
  </footer>

  <!-- Script -->
  <script src="js/app.js"></script>
  <script>
    // Get slug from URL
    function getQueryParam(name) {
      var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
      return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
    }

    var slug = getQueryParam('slug');
    var container = document.getElementById('article-container');

    if (!slug) {
      container.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--muted-foreground);"><p>找不到此文章</p><p><a href="articles.html">返回列表</a></p></div>';
    } else {
      staticApp.getArticleBySlug(slug, function(article) {
        if (!article) {
          container.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--muted-foreground);"><p>找不到此文章</p><p><a href="articles.html">返回列表</a></p></div>';
          return;
        }

        // Build content HTML
        var contentHtml = '';
        article.content.forEach(function(block) {
          if (block.type === 'p') {
            contentHtml += '<p>' + escapeHtml(block.text) + '</p>';
          } else if (block.type === 'h') {
            contentHtml += '<h2>' + escapeHtml(block.text) + '</h2>';
          } else if (block.type === 'ul') {
            contentHtml += '<ul>';
            block.items.forEach(function(item) {
              contentHtml += '<li>' + escapeHtml(item) + '</li>';
            });
            contentHtml += '</ul>';
          } else if (block.type === 'ol') {
            contentHtml += '<ol>';
            block.items.forEach(function(item) {
              contentHtml += '<li>' + escapeHtml(item) + '</li>';
            });
            contentHtml += '</ol>';
          } else if (block.type === 'quote') {
            contentHtml += '<div class="article-quote">' + escapeHtml(block.text) + '</div>';
          }
        });

        // Build attachments HTML
        var attachmentsHtml = '';
        if (article.attachments && article.attachments.length > 0) {
          attachmentsHtml = '<div class="article-attachments">';
          attachmentsHtml += '<div class="attachments-title">相关附件</div>';
          attachmentsHtml += '<ul class="attachment-list">';
          article.attachments.forEach(function(att) {
            attachmentsHtml += '<li class="attachment-item">';
            attachmentsHtml += '<span class="attachment-name">';
            attachmentsHtml += '<span class="attachment-badge">' + att.type + '</span>';
            attachmentsHtml += '<span>' + escapeHtml(att.name) + '</span>';
            attachmentsHtml += '</span>';
            attachmentsHtml += '<span class="attachment-size">' + att.size + '</span>';
            attachmentsHtml += '</li>';
          });
          attachmentsHtml += '</ul>';
          attachmentsHtml += '</div>';
        }

        // Get related articles for navigation
        var navHtml = '<div style="text-align: center; padding: 1rem; color: var(--muted-foreground);">加载相关文章中...</div>';

        container.innerHTML = '<article>' +
          '<div class="article-header">' +
          '<h1>' + escapeHtml(article.title) + '</h1>' +
          '<div class="article-meta">' +
          '<div><dt>分类</dt><dd>' + escapeHtml(article.category) + '</dd></div>' +
          '<div><dt>发布时间</dt><dd>' + article.date + '</dd></div>' +
          '<div><dt>作者</dt><dd>' + escapeHtml(article.author) + '</dd></div>' +
          '<div><dt>来源</dt><dd>' + escapeHtml(article.source) + '</dd></div>' +
          '</div>' +
          '</div>' +
          '<div class="article-content">' +
          contentHtml +
          attachmentsHtml +
          '</div>' +
          '<button id="print-article" style="padding: 0.5rem 1rem; background-color: var(--secondary); border: 1px solid var(--border); border-radius: 0.25rem; cursor: pointer; margin-bottom: 1rem;">打印</button>' +
          navHtml +
          '</article>';

        // Load related articles
        staticApp.getRelatedArticles(slug, 2, function(related) {
          if (related.length >= 2) {
            var prevHtml = '<div class="nav-link">' +
              '<span class="nav-label">上一篇</span>' +
              '<a href="detail.html?slug=' + related[0].slug + '" style="text-decoration: none; color: inherit;">' + escapeHtml(related[0].title.substring(0, 30)) + '...</a>' +
              '</div>';

            var nextHtml = '<div class="nav-link">' +
              '<span class="nav-label">下一篇</span>' +
              '<a href="detail.html?slug=' + related[1].slug + '" style="text-decoration: none; color: inherit;">' + escapeHtml(related[1].title.substring(0, 30)) + '...</a>' +
              '</div>';

            var article = container.querySelector('article');
            var navDiv = document.createElement('div');
            navDiv.className = 'article-nav';
            navDiv.innerHTML = prevHtml + nextHtml;
            article.appendChild(navDiv);
          }

          // Attach print functionality
          setTimeout(function() {
            var printBtn = document.getElementById('print-article');
            if (printBtn) {
              printBtn.addEventListener('click', function() {
                window.print();
              });
            }
          }, 100);
        });
      });
    }

    // HTML escape function
    function escapeHtml(text) {
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
  </script>
</body>
</html>
